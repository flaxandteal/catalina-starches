name: Run full build
run-name: Run full build
on:
  workflow_dispatch: {}
  push:
    branches:
      - '**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

jobs:
  build-starches:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: 'true'

      - name: Download and extract prebuild tarball
        run: |
          aws s3 cp \
            s3://$S3_BUCKET_NAME/starches/prebuild/${{ secrets.PREBUILD_TARBALL }} \
            prebuild.tar.gz \
            --endpoint-url $S3_ENDPOINT_URL
          tar -xzf prebuild.tar.gz -C .
          rm prebuild.tar.gz
          echo "Extracted files:"
          ls -la prebuild/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build . \
            --file ./Dockerfile \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-public:latest-${{ github.run_id }} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-public:${{ github.sha }} \
            --build-arg STARCHES_INCLUDE_PRIVATE=0
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-public:latest-${{ github.run_id }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-public:${{ github.sha }}
