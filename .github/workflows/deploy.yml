name: Deploy to Azure

on:
  workflow_run:
    workflows: ["Build and Test"]
    types:
      - completed
    branches:
      - dev

jobs:
  deploy_job:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download data from Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          mkdir -p blob-data
          az storage blob download-batch \
            --source ${{ secrets.BLOB_CONTAINER_NAME }} \
            --destination ./blob-data
      
      - name: Log in to Docker Registry
        run: echo ${{ secrets.DOCKER_REGISTRY_TOKEN }} | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      
      - name: Pull Docker Image
        run: docker pull ghcr.io/flaxandteal/quartz-starches:${{ github.event.workflow_run.head_sha }}
      
      - name: Extract docs Directory
        run: |
          mkdir -p docs
          docker create --name temp-container ghcr.io/flaxandteal/quartz-starches:${{ github.event.workflow_run.head_sha }}
          docker cp temp-container:/usr/share/nginx/html/. ./docs/
          docker rm temp-container

      - name: Copy Static Web App Config
        run: cp staticwebapp.config.json docs/
              
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_BAY_084176900 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "docs"
          skip_app_build: true
