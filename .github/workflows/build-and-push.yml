name: Run full build
run-name: Run full build
on:
  workflow_dispatch: {}
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-starches:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: 'true'

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          aws --version

      - name: Fetch graphs
        run: |
          mkdir -p prebuild/graphs/resource_models
          
          # Test S3 connection
          echo "Testing S3 connection..."
          aws --endpoint-url ${{ secrets.S3_ENDPOINT_URL }} s3 ls s3://${{ secrets.S3_BUCKET_NAME }}/ || echo "Connection test completed"
          
          # Download all files from graphs directory
          aws --endpoint-url ${{ secrets.S3_ENDPOINT_URL }} s3 sync \
                s3://${{ secrets.S3_BUCKET_NAME }}/starches/graphs/ \
                prebuild/graphs/resource_models/
          
          echo "✓ Downloaded graph files:"
          ls -lh prebuild/graphs/resource_models/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

      - name: Fetch business data
        run: |
          mkdir -p prebuild/business_data
          
          # Download all files from business data directory
          aws --endpoint-url ${{ secrets.S3_ENDPOINT_URL }} s3 sync \
                s3://${{ secrets.S3_BUCKET_NAME }}/starches/business_data/ \
                prebuild/business_data/
          
          echo "✓ Downloaded business data files:"
          ls -lh prebuild/business_data/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build . \
            --file ./Dockerfile \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:${{ github.sha }} \
            --build-arg STARCHES_INCLUDE_PRIVATE=0
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:${{ github.sha }}
          