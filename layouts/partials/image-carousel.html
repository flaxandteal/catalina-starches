<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="{{ getenv "BLOB_BASE_URL" }}" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

<!-- Slider main container -->
<div class="swiper assetSwiper">
    <div class="swiper-wrapper">
        <!-- Placeholder slides shown while loading -->
        <div class="swiper-slide placeholder-slide"><div class="placeholder-shimmer"></div></div>
        <div class="swiper-slide placeholder-slide"><div class="placeholder-shimmer"></div></div>
        <div class="swiper-slide placeholder-slide"><div class="placeholder-shimmer"></div></div>
    </div>
    <div class="swiper-pagination"></div>
    {{ if .Params.carousel.includeButtons }}
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
    {{ end }}
</div>

{{ if .Params.carousel.showModal }}
<div id="image-modal" class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <img id="modal-img" src="" alt="">
  <button id="close-modal" aria-label="Close modal">&times;</button>
</div>
{{ end }}
