name: Run full build
run-name: Run full build
on:
  workflow_dispatch: {}
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

jobs:
  build-starches:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: 'true'

      - name: Create prebuild directory structure
        run: |
          mkdir -p prebuild/graphs/resource_models
          mkdir -p prebuild/graphs/branches
          mkdir -p prebuild/business_data

      - name: Fetch graphs
        run: |
          # Download all files from graphs directory
          aws s3 sync \
                s3://$S3_BUCKET_NAME/starches/graphs/ \
                prebuild/graphs/resource_models/ \
                --endpoint-url $S3_ENDPOINT_URL
          
          echo "✓ Downloaded graph files:"
          ls -lah prebuild/graphs/resource_models/

      - name: Fetch business data
        run: |
          # Download all files from business data directory
          aws s3 sync \
                s3://$S3_BUCKET_NAME/starches/business_data/ \
                prebuild/business_data/ \
                --endpoint-url $S3_ENDPOINT_URL
          
          echo "✓ Downloaded business data files:"
          ls -lah prebuild/business_data/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build . \
            --file ./Dockerfile \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:${{ github.sha }} \
            --build-arg STARCHES_INCLUDE_PRIVATE=0
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:${{ github.sha }}