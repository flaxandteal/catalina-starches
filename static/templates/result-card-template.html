<div class="col d-none d-md-flex" data-slug="{{slug}}">
    <div class="card card-default default icon-left card-multi-action">
        <div class="card-body result-card pb-0 w-100">
            <h4 class="card-title">
                <a href="{{url}}" target="_blank">{{title}}</a>
            </h4>
            <div class="card-body result-card pt-md-0 px-md-0 d-flex align-items-start w-100 gap-3">
                <div class="card-image d-flex">
                    {{#if thumbnailURL}}
                    <img src="{{thumbnailURL}}" alt="{{ thumbnailAlt }}">
                    <span class="qld-icon qld-icon-lg qld-icon-{{ icon }} icon-left card-image-fallback"
                        aria-hidden="true"></span>
                    {{/if}}
                </div>
                <div class="card-text">
                    {{{excerpt}}}
                </div>
            </div>
        </div>
        <div class="card-footer">
            <ul class="link-list">
                <li class="link-item"><a class="link open-button" href="{{url}}" target="_blank"
                        aria-label="Open {{title}}">
                        <span class="qld-icon qld-icon-md qld-icon-arrow-right leading" aria-hidden="true"></span>
                        Open
                    </a></li>
                {{#if location}}
                <li class="link-item"><a class="link view-button" href="#"
                        onclick="event.preventDefault(); window.map.flyTo({center: [{{location}}], zoom: 14})"
                        data-location="{{location}}" aria-label="View {{title}} on map">
                        <span class="qld-icon qld-icon-md qld-icon-location leading" aria-hidden="true"></span>
                        View on map
                    </a></li>
                {{/if}}
            </ul>
        </div>
    </div>
</div>

<div class="col d-flex d-md-none" data-slug="{{slug}}">
    <div class="card card-default default card-multi-action w-100">
        <div class="card-img ratio ratio-16x9">
            {{#if thumbnailURL}}
            <div class="card-img-top"
                style="--card-image:url({{thumbnailURL}})" alt="{{ thumbnailAlt }}"></div>
            {{/if}}
        </div>
        <div class="card-body result-card">
            <h4 class="card-title">
                <a href="{{url}}" target="_blank">{{title}}</a>
            </h4>
            <div class="card-text">
                {{{excerpt}}}
            </div>
        </div>
        <div class="card-footer">
            <ul class="link-list justify-content-around">
                <li class="link-item"><a class="link open-button" href="{{url}}" target="_blank"
                        aria-label="Open {{title}}">
                        <span class="qld-icon qld-icon-md qld-icon-arrow-right leading" aria-hidden="true"></span>
                        Open
                    </a></li>
                {{#if location}}
                <li class="link-item"><a class="link view-button" href="#"
                        onclick="event.preventDefault(); window.map.flyTo({center: [{{location}}], zoom: 14})"
                        data-location="{{location}}" aria-label="View {{title}} on map">
                        <span class="qld-icon qld-icon-md qld-icon-location leading" aria-hidden="true"></span>
                        View on map
                    </a></li>
                {{/if}}
            </ul>
        </div>
    </div>
</div>
