<div class="pagefind-modular-list-result" data-slug="{{slug}}">
    <div class="pagefind-modular-list-content">
        <p class="pagefind-modular-list-title">
            <a href="{{url}}">{{title}}</a>
        </p>
        <p class="pagefind-modular-list-excerpt">
            {{{excerpt}}}
        </p>
        <p class="result-links">
            <div class="govuk-button-group">
                <a href="{{url}}" role="button" draggable="false" class="govuk-button" data-module="govuk-button">View</a>
                <a href="{{url}}" role="button" draggable="false" class="govuk-button govuk-button--secondary" data-module="govuk-button" target="_blank">Open tab</a>
                {{#if location}}
                <button type="submit" class="govuk-button govuk-button--secondary" data-module="govuk-button" data-location="{{location}}" onclick="window.__starchesManagers.primaryMap.then(function(map) { map.flyTo({center: [{{location}}], zoom: {{zoomLevel}}) })">Zoom</button>
                {{/if}}
            </div>
        </p>
    </div>
</div>
