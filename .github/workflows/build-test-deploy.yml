name: Build, Test, and Deploy

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - dev

jobs:
  build_and_test:
    name: Build Docker Image and Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: false
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # - name: Build Docker Image
      #   run: |
      #     docker build -t ghcr.io/flaxandteal/quartz-starches:latest .
      #     echo ${{ secrets.DOCKER_REGISTRY_TOKEN }} | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      #     docker push ghcr.io/flaxandteal/quartz-starches:latest

      - name: Pull Docker Image for Testing
        run: docker pull ghcr.io/flaxandteal/quartz-starches:latest

      - name: Run Tests in Docker Container
        run: |
          docker run --rm ghcr.io/flaxandteal/quartz-starches:latest sh -c "npm ci && npm run test:lint:css && npx cypress run"

  deploy:
    name: Deploy
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Registry
        run: echo ${{ secrets.DOCKER_REGISTRY_TOKEN }} | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Pull Docker Image
        run: docker pull ghcr.io/flaxandteal/quartz-starches:latest

      - name: Extract docs Directory
        run: |
          mkdir -p docs
          docker create --name temp-container ghcr.io/flaxandteal/quartz-starches:latest
          docker cp temp-container:/usr/share/nginx/html ./docs
          docker rm temp-container

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_BAY_084176900 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "docs" # Point to the built output folder
          api_location: "" # Api source code path - optional
          output_location: "" # Empty since app_location already points to the output
          skip_app_build: true # Skip Oryx build since we already have the HTML files

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
