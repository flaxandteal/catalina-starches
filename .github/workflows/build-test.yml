name: Build and Test

on:
  push:
    branches:
      - '**' 

jobs:
  build_image_job:
    runs-on: self-hosted
    name: Build Docker Image
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: false
          lfs: false

      - name: Download and extract prebuild tarball
        run: |
          curl -fsSL "${{ secrets.BLOB_BASE_URL }}/content/prebuild/${{ secrets.PREBUILD_TARBALL }}" -o prebuild.tar.gz
          tar -xzf prebuild.tar.gz -C .
          rm prebuild.tar.gz
          echo "Extracted files:"
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch site content from blob
        env:
          BLOB_BASE_URL: ${{ secrets.BLOB_BASE_URL }}
        run: npx ts-node utils/fetch-content.ts

      - name: Log in to Docker Registry
        run: echo ${{ secrets.DOCKER_REGISTRY_TOKEN }} | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      
      - name: Build and Push Docker Image
        run: |
          docker build \
            --build-arg BLOB_BASE_URL=${{ secrets.BLOB_BASE_URL }} \
            -t ghcr.io/flaxandteal/quartz-starches:${{ github.sha }} .
          docker push ghcr.io/flaxandteal/quartz-starches:${{ github.sha }}

  test_job:
    needs: build_image_job
    runs-on: self-hosted
    name: Test Job
    steps:
      - uses: actions/checkout@v3
      
      - name: Log in to Docker Registry
        run: echo ${{ secrets.DOCKER_REGISTRY_TOKEN }} | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      
      - name: Pull Docker Image
        run: docker pull ghcr.io/flaxandteal/quartz-starches:${{ github.sha }}
      
      - name: Extract docs Directory
        run: |
          mkdir -p docs
          docker create --name temp-container ghcr.io/flaxandteal/quartz-starches:${{ github.sha }}
          docker cp temp-container:/usr/share/nginx/html/. ./docs/
          docker rm temp-container
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run CSS linter
        run: npm run test:lint:css
      
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          start: npx serve docs -l 1314
          wait-on: 'http://127.0.0.1:1314'
          wait-on-timeout: 60
          browser: electron
          config: baseUrl=http://127.0.0.1:1314,video=false
          install: false
      
      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
