<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
{{- $swiper := resources.Get "swiper.ts" | js.Build -}}

<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<script src="{{ $swiper.RelPermalink }}" {{ if hugo.IsProduction }}integrity="{{ $swiper.Data.Integrity }}" {{ end
    }}></script>

<!-- Slider main container -->
<div class="swiper assetSwiper">
    <div class="swiper-wrapper">
    </div>
    <div class="swiper-pagination"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
</div>

<div id="image-modal" class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <img id="modal-img" src="" alt="">
  <button id="close-modal" aria-label="Close modal">&times;</button>
</div>
