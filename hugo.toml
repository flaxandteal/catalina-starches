baseURL = 'https://example.org/'
languageCode = 'en-gb'
title = 'Queensland Heritage'
theme = "hugo-theme-qld-design-system"
publishDir = "docs"
canonifyurls = true

[markup.goldmark.renderer]
unsafe = true

[params]
govuk = false
logotext = "ABC"
product = "NI HED Public Asset Quickview"
phase = "alpha"
feedbackurl = "/feedback/"
archesurl = "http://localhost:8000/"
ga4token = "GTM-K3B6FBDS"
ga4gtag = "G-HJZQETB39E"
cookies = "/cookies/"
sitename = "Starches"
variantClass = "dark"

[[module.mounts]]
source = "content"
target = "content"

[module]
  [[module.imports]]
    path = 'github.com/flaxandteal/starches'

[params.header]
  # Enable the "Delivering for Queensland" logo variant
  hasDeliveringForQLDLogo = true

  # Pre-header section (top bar with global link and optional dropdowns)
  [params.header.preHeader]
    # Palette: "dark", "default", or "dark-alt"
    palette = "dark"
    
    # Global link
    [params.header.preHeader.globalLink]
      url = "https://flaxandteal.co.uk"
      text = "flaxandteal.co.uk"
    
    # Optional: custom logo for pre-header
    logo = "https://cdn.jsdelivr.net/npm/@qld-gov-au/qgds-bootstrap5@2.0.9/dist/assets/img/header-search.svg"
    
    # Optional: Actions/links in pre-header (right side)
    [[params.header.preHeader.actions]]
      id = "contact"
      text = "Contact us"
      url = "/contact"
      icon = "phone"  # optional icon name
    
    # Optional: Dropdown menu example
    [[params.header.preHeader.actions]]
      id = "services"
      text = "Services"
      [params.header.preHeader.actions.dropdown]
        type = "list"
        [[params.header.preHeader.actions.dropdown.items]]
          text = "Service 1"
          url = "/services/service-1"
        [[params.header.preHeader.actions.dropdown.items]]
          text = "Service 2"
          url = "/services/service-2"
          target = "_blank"
        [params.header.preHeader.actions.dropdown.viewMore]
          text = "View all services"
          url = "/services"

  # Main header section (brand, logo, site title)
  [params.header.mainContent]
    # Palette: "dark", "default", or "dark-alt"
    palette = "default"
    
    # URL when clicking the header brand
    url = "/"
    
    # Site title and subline
    siteTitle = "Starches Heritage"
    subline = "This is the dev site"
    
    # Logo configuration (optional - if not set, uses siteTitle with default QLD crest)
    [params.header.mainContent.logo]
      src = "img/flaxteal.jpg"
      altText = "Flax and Teal"
    
    # Optional: Secondary logo (for co-branded sites)
    # [params.header.mainContent.secondaryLogo]
    #   src = "img/partner-logo.svg"
    #   altText = "Partner Organization"

  # Site search configuration
  [params.header.assets.siteSearch]
    # Enable/disable search
    value = false
    
    # Search form action URL
    [params.header.assets.siteSearch.formAction]
      url = "https://www.qld.gov.au/search"
  
  # Optional: Custom HTML for search input
  # searchInput = '<input type="search" class="form-control" placeholder="Search..." />'

[params.footer]
  # Contact column
  [params.footer.contact]
    title = "Contact us"
    content = "<p>Get in touch for enquiries, feedback, complaints and compliments.</p>"
    buttonLabel = "Contact us"
    buttonLink = ""
    hasBorderColumn = false
    showList = false

  # Optional columns (can be omitted)
  # [params.footer.optionalColumn1]
  #   title = "Related links"
  #   content = "<p>Links and resources</p>"
  #   hasBorderColumn = false
  #   showFollowLinks = false
  #   showCustomLinks = false

  # [params.footer.optionalColumn2]
  #   title = "More"
  #   content = ""
  #   hasBorderColumn = false
  #   showFollowLinks = false
  #   showCustomLinks = false

  # Footer (WOG) links list
  [params.footer.footerLinks]
    title = "Useful links"
    hasBorderColumn = false

  [[params.footer.footerLinks.list]]
    label = "Help"
    link = ""

  [[params.footer.footerLinks.list]]
    label = "Copyright"
    link = ""

  [[params.footer.footerLinks.list]]
    label = "Disclaimer"
    link = ""

  [[params.footer.footerLinks.list]]
    label = "Privacy"
    link = ""

  [[params.footer.footerLinks.list]]
    label = "Right to information"
    link = ""

  [[params.footer.footerLinks.list]]
    label = "Accessibility"
    link = ""

  [[params.footer.footerLinks.list]]
    label = "Jobs"
    link = ""
    target = "_blank"

  [[params.footer.footerLinks.list]]
    label = "Other languages"
    link = ""

  # Acknowledgements (array of blocks)
  [[params.footer.acknowledgements]]
    title = "Acknowledgement"
    content = "<p>We pay our respects to the Aboriginal and Torres Strait Islander ancestors of this land, their spirits and their legacy.</p>"

  # Footer logo or crest
  [params.footer.footerLogo]
    src = "img/footer-logo.svg"
    alt = "Footer logo"
    show = true

  # Organisation link block
  [params.footer.organisationLink]
    show = true
    URL = ""
    text = "Starches"

  [params.footer.copyright]
    content = "©"
    showYearFrom = false
    yearFrom = 2020

  # Follow/Social media links (used in optional columns)
  [[params.footer.followLinks]]
    label = "Facebook"
    link = "https://www.facebook.com/"
    icon = "facebook"
    target = "_blank"

  [[params.footer.followLinks]]
    label = "Twitter"
    link = "https://twitter.com/"
    icon = "twitter-x"
    target = "_blank"

  [[params.footer.followLinks]]
    label = "LinkedIn"
    link = "https://www.linkedin.com/"
    icon = "linkedin"
    target = "_blank"

  [[params.footer.followLinks]]
    label = "Instagram"
    link = "https://www.instagram.com/"
    icon = "instagram"
    target = "_blank"

  # Feedback form (used in optional columns)
  [params.footer.feedbackForm]
    show = false
    title = "Provide feedback"
    description = "Help us improve by providing your feedback."
    action = "/submit-feedback"
    method = "POST"
    submitLabel = "Submit feedback"

    [[params.footer.feedbackForm.fields]]
      id = "feedback-type"
      label = "Feedback type"
      type = "select"
      required = true
      placeholder = "Select feedback type"
      [[params.footer.feedbackForm.fields.options]]
        value = "general"
        text = "General feedback"
      [[params.footer.feedbackForm.fields.options]]
        value = "complaint"
        text = "Complaint"
      [[params.footer.feedbackForm.fields.options]]
        value = "compliment"
        text = "Compliment"
      [[params.footer.feedbackForm.fields.options]]
        value = "suggestion"
        text = "Suggestion"

    [[params.footer.feedbackForm.fields]]
      id = "feedback-message"
      label = "Your feedback"
      type = "textarea"
      required = true
      placeholder = "Please enter your feedback here"
      rows = 5

    [[params.footer.feedbackForm.fields]]
      id = "feedback-email"
      label = "Email (optional)"
      type = "email"
      placeholder = "your.email@example.com"
      required = false

    [[params.footer.feedbackForm.fields]]
      id = "feedback-privacy"
      label = "I agree to the <a href=\"/legal/privacy\">privacy policy</a>"
      type = "checkbox"
      required = true

[params.navbar]
# Navbar site-level params. The partial reads page .Params.navbar first, then falls back to this site-level block.
navbarbrandname = "Starches Heritage"
alternativecolor = false
verticalorientation = false

[[params.navbar.navigation]]
text = "Home"
hidelabel = true
iconname = "qld-icon-home"
url = "/"

