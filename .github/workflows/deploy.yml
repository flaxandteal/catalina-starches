name: Deploy to Azure

on:
  push:
  workflow_run:
    workflows: ["Build and Test"]
    types:
      - completed
    branches:
      - dev

jobs:
  deploy_job:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3      
      
      - name: Log in to Docker Registry
        run: echo ${{ secrets.DOCKER_REGISTRY_TOKEN }} | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      
      - name: Pull Docker Image
        run: docker pull ghcr.io/flaxandteal/quartz-starches:${{ github.event.workflow_run.head_sha }}
      
      - name: Extract docs Directory
        run: |
          mkdir -p docs
          docker create --name temp-container ghcr.io/flaxandteal/quartz-starches:${{ github.event.workflow_run.head_sha }}
          docker cp temp-container:/usr/share/nginx/html/. ./docs/
          docker rm temp-container

      # Login to Azure using OIDC
      - name: Azure Login using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      # Upload files to Azure Storage $web container
      - name: Upload to Azure Storage Static Website
        run: |
          az storage blob upload-batch \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --destination '$web' \
            --source docs \
            --auth-mode login \
            --overwrite
      
      # Logout from Azure
      - name: Azure Logout
        if: always()
        run: az logout
