{{#if (equal sectionId "asset-related")}}
<div class="accordion-item">
  <h2 class="accordion-header" id="heading-{{id}}">
    <button
      class="accordion-button"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#collapse-{{id}}"
      aria-expanded="true"
      aria-controls="collapse-{{id}}"
    >
      {{title}}
    </button>
  </h2>
  <div
    id="collapse-{{id}}"
    class="accordion-collapse collapse show"
    aria-labelledby="heading-{{id}}"
    role="region"
  >
    <div class="accordion-body">
      <div class="d-flex align-items-start">
        <div class="icon-background">
            <span class="qld-icon qld-icon-lg qld-icon-{{ icon }} icon-left" aria-hidden="true"></span>
        </div>
        <div class="link-column ms-4">
          <ul class="nav">
          {{#if fields}} {{#each fields}}
            <li class="nav-item">
              <a class="nav-link" href="{{slug}}">{{{value}}}</a>
            </li>
          {{/each}} {{else}} {{{body}}} {{/if}}
        </div>  
      </div>
    </div>
  </div>
</div>
{{else}}
<div class="accordion-item">
  <h2 class="accordion-header" id="heading-{{id}}">
    <button
      class="accordion-button"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#collapse-{{id}}"
      aria-expanded="true"
      aria-controls="collapse-{{id}}"
    >
      {{title}}
    </button>
  </h2>
  <div
    id="collapse-{{id}}"
    class="accordion-collapse collapse show"
    aria-labelledby="heading-{{id}}"
    role="region"
  >
    <div class="accordion-body">
      <div class="ms-4">
        {{#if fields}} {{#each fields}}
        <p><strong>{{label}}:</strong> {{{value}}}</p>
        {{/each}} {{else}} {{{body}}} {{/if}}
      </div>
    </div>
  </div>
</div>
{{/if}}
