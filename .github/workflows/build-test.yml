name: Build and Test

on:
  push:
    branches:
      - '**' 

jobs:
  build_image_job:
    runs-on: ubuntu-latest
    name: Build Docker Image
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: false
          lfs: false
      
      - name: Azure login with OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get runner IP
        id: runner-ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Allow runner IP in storage firewall
        run: |
          az storage account network-rule add \
            --account-name ${{ secrets.BLOB_STORAGE_ACCOUNT }} \
            --ip-address ${{ steps.runner-ip.outputs.ipv4 }}
          echo "Waiting for firewall rule to propagate..."
          sleep 30

      - name: Download data from Blob Storage
        run: |
          mkdir -p blob-data
          az storage blob download-batch \
            --source ${{ secrets.BLOB_CONTAINER_NAME }} \
            --destination ./blob-data \
            --account-name ${{ secrets.BLOB_STORAGE_ACCOUNT }} \
            --auth-mode login \
            --pattern "prebuild/*"
          echo "Downloaded files:"
          ls -la ./blob-data/prebuild

      - name: Extract prebuild tarball
        run: |
          tar -xzf ./blob-data/prebuild/${{ secrets.PREBUILD_TARBALL }} -C .
          echo "Extracted files:"
          ls -la
      
      - name: Log in to Docker Registry
        run: echo ${{ secrets.DOCKER_REGISTRY_TOKEN }} | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      
      - name: Build and Push Docker Image
        run: |
          docker build \
            --build-arg BLOB_BASE_URL=${{ secrets.BLOB_BASE_URL }} \
            -t ghcr.io/flaxandteal/quartz-starches:${{ github.sha }} .
          docker push ghcr.io/flaxandteal/quartz-starches:${{ github.sha }}

      - name: Remove runner IP from storage firewall
        if: always()
        run: |
          az storage account network-rule remove \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --ip-address ${{ steps.runner-ip.outputs.ipv4 }}

  test_job:
    needs: build_image_job
    runs-on: ubuntu-latest
    name: Test Job
    steps:
      - uses: actions/checkout@v3
      
      - name: Log in to Docker Registry
        run: echo ${{ secrets.DOCKER_REGISTRY_TOKEN }} | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      
      - name: Pull Docker Image
        run: docker pull ghcr.io/flaxandteal/quartz-starches:${{ github.sha }}
      
      - name: Extract docs Directory
        run: |
          mkdir -p docs
          docker create --name temp-container ghcr.io/flaxandteal/quartz-starches:${{ github.sha }}
          docker cp temp-container:/usr/share/nginx/html/. ./docs/
          docker rm temp-container
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run CSS linter
        run: npm run test:lint:css
      
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          start: npx http-server docs -a 127.0.0.1 -p 1314 -c-1
          wait-on: 'http://127.0.0.1:1314'
          wait-on-timeout: 60
          browser: chrome
          config: baseUrl=http://127.0.0.1:1314
          install: false
      
      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
      
      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
