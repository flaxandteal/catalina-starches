{{#if (equal sectionId "asset-related")}}
<h2 id="heading-{{id}}">{{title}}</h2>
<details class="govuk-details" {{#if initiallyExpanded}}open{{/if}}>
  <summary class="govuk-details__summary">
    <span class="govuk-details__summary-text">{{title}}</span>
  </summary>
  <div class="govuk-details__text">
    {{#if fields}}
    <ul class="govuk-list">
      {{#each fields}}
      <li>
        <a class="govuk-link" href="{{slug}}">{{{value}}}</a>
      </li>
      {{/each}}
    </ul>
    {{else}}
    {{{body}}}
    {{/if}}
  </div>
</details>
{{else}}
<h2 id="heading-{{id}}">{{title}}</h2>
<details class="govuk-details" {{#if initiallyExpanded}}open{{/if}}>
  <summary class="govuk-details__summary">
    <span class="govuk-details__summary-text">{{title}}</span>
  </summary>
  <div class="govuk-details__text">
    {{#if fields}}
    <dl class="govuk-summary-list govuk-summary-list--no-border">
      {{#each fields}}
      <div class="govuk-summary-list__row">
        <dt class="govuk-summary-list__key">{{label}}</dt>
        <dd class="govuk-summary-list__value">{{{value}}}</dd>
      </div>
      {{/each}}
    </dl>
    {{else}}
    {{{body}}}
    {{/if}}
  </div>
</details>
{{/if}}
