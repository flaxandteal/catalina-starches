name: Run full build
run-name: Run full build
on:
  workflow_dispatch: {}
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-starches:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: 'true'

      - name: Install s3cmd
        run: |
          sudo apt-get update
          sudo apt-get install -y s3cmd

      - name: Configure s3
        run: |
          cat > ~/.s3cfg << EOF
          [default]
          access_key = ${{ secrets.S3_ACCESS_KEY }}
          secret_key = ${{ secrets.S3_SECRET_KEY }}
          host_base = ${{ secrets.S3_HOST_BASE }}
          host_bucket = ${{ secrets.S3_HOST_BASE }}
          use_https = True
          signature_v2 = False
          check_ssl_certificate = True
          check_ssl_hostname = True
          EOF
          
          # Verify configuration and list bucket
          echo "Testing S3 connection..."
          s3cmd ls s3://${{ secrets.S3_BUCKET_NAME }}/ || echo "Connection test completed"

      - name: Fetch graphs
        run: |
          mkdir -p prebuild/graphs/resource_models
          
          # List available paths for debugging
          echo "Checking available paths..."
          s3cmd ls s3://${S3_BUCKET_NAME}/starches/ || true
          
          # Download all JSON files from graphs directory
          s3cmd get --recursive \
                --force \
                "s3://${S3_BUCKET_NAME}/starches/graphs/" \
                prebuild/graphs/resource_models/
          
          echo "✓ Downloaded graph files:"
          ls -lh prebuild/graphs/resource_models/
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

      - name: Fetch business data
        run: |
          mkdir -p prebuild/business_data
          
          # Download all JSON files from business data directory
          s3cmd get --recursive \
                --force \
                "s3://${S3_BUCKET_NAME}/starches/business_data/" \
                prebuild/business_data/
          
          echo "✓ Downloaded business data files:"
          ls -lh prebuild/business_data/
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build . \
            --file ./Dockerfile \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:${{ github.sha }} \
            --build-arg STARCHES_INCLUDE_PRIVATE=0
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:${{ github.sha }}
