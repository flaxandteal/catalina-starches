name: Build and Test

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  INTERNAL_REGISTRY: registry.srv-registry.svc.cluster.local:5000
  INTERNAL_IMAGE: catalina-starches-private

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build_image_job_private:
    runs-on: [new-zealand]
    name: "Build Docker Image (private)"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: false
          lfs: false

      - name: Download and extract prebuild tarball
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/starches/prebuild/prebuild.tar prebuild.tar --endpoint-url ${{ secrets.S3_ENDPOINT_URL }}
          tar -xf prebuild.tar -C .
          rm prebuild.tar
          echo "Extracted files:"
          ls -la

      # Note: we deliberately do NOT run `npm ci` on the host here.
      # The Dockerfile runs its own `npm install`, so a host-side install
      # just balloons the build context (shipping ./node_modules to dind)
      # and overwrites the image's freshly-installed modules via COPY . .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Diagnostic snapshot of runner pod state before the build.
      # Lets us correlate build failures with real memory/disk numbers
      # instead of guessing. `|| true` on each command so a missing tool
      # never fails the job.
      - name: Debug runner resources (pre-build)
        run: |
          echo "== uname =="
          uname -a || true
          echo "== memory (free -m) =="
          free -m || true
          echo "== memory (/proc/meminfo top) =="
          head -n 5 /proc/meminfo || true
          echo "== disk (df -h) =="
          df -h || true
          echo "== cgroup memory limit =="
          cat /sys/fs/cgroup/memory.max 2>/dev/null || \
            cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || \
            echo "cgroup memory files not readable"
          echo "== docker version =="
          docker version || true
          echo "== docker info (short) =="
          docker info 2>/dev/null | grep -E "Server Version|Storage Driver|Runtimes|Kernel Version|Operating System|Total Memory|CPUs" || true
          echo "== docker system df =="
          docker system df || true

      - name: Build Docker Image
        run: |
          docker build . \
            --file ./Dockerfile.private \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:${{ github.sha }} \
            --build-arg STARCHES_INCLUDE_PRIVATE=1

      # Only runs if build failed. Captures post-mortem state — disk may
      # have filled, dockerd may have been partially killed, etc.
      - name: Debug runner resources (post-failure)
        if: failure()
        run: |
          echo "== memory =="
          free -m || true
          echo "== disk =="
          df -h || true
          echo "== docker system df =="
          docker system df || true
          echo "== dmesg tail (if available) =="
          dmesg 2>/dev/null | tail -n 50 || echo "dmesg not accessible from runner container"

      - name: Push Docker Image (SHA tag)
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:${{ github.sha }}

      - name: Tag and Push latest (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:latest-${{ github.run_id }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:latest-${{ github.run_id }}

      - name: Push to internal registry (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          # INTERNAL_REGISTRY_PASSWORD is injected as a pod env var from
          # the registry-push-creds Kubernetes secret. Skip if not set
          # (e.g. running on a non-cluster runner).
          if [ -z "${INTERNAL_REGISTRY_PASSWORD}" ]; then
            echo "INTERNAL_REGISTRY_PASSWORD not set, skipping internal push"
            exit 0
          fi
          echo "${INTERNAL_REGISTRY_PASSWORD}" | docker login "${INTERNAL_REGISTRY}" \
            --username "${INTERNAL_REGISTRY_USER}" --password-stdin
          docker tag \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:${{ github.sha }} \
            ${INTERNAL_REGISTRY}/${{ env.INTERNAL_IMAGE }}:latest-${{ github.run_id }}
          docker push ${INTERNAL_REGISTRY}/${{ env.INTERNAL_IMAGE }}:latest-${{ github.run_id }}

  test_job_private:
    needs: build_image_job_private
    runs-on: [new-zealand]
    name: Test Job
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker Image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:${{ github.sha }}

      - name: Extract docs Directory
        run: |
          mkdir -p docs
          docker create --name temp-container ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:${{ github.sha }}
          docker cp temp-container:/usr/share/nginx/html/. ./docs/
          docker rm temp-container
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run CSS linter
        run: npm run test:lint:css
      
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          start: npx serve docs -l 1314
          wait-on: 'http://127.0.0.1:1314'
          wait-on-timeout: 60
          browser: electron
          config: baseUrl=http://127.0.0.1:1314,video=false
          install: false
      
      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
