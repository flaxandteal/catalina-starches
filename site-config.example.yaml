# Site Configuration Template
# ==========================
# Copy this file to your blob storage as 'site-config.yaml'
# and customize for your heritage site deployment.
#
# Blob location: ${BLOB_BASE_URL}/site-config.yaml

version: "1.0"

# ============================================
# SITE IDENTITY
# ============================================
site:
  # Main site title (appears in browser tab)
  title: "Heritage Register"

  # Short site name (used in footer, references)
  sitename: "Heritage"

  # Production URL (used for canonical URLs, sitemap)
  baseURL: "https://heritage.example.gov"

  # Language code (en-gb, en-au, en-us, etc.)
  languageCode: "en-gb"

# ============================================
# BRANDING & ASSETS
# ============================================
# Image paths can be:
#   - Relative to blob storage (e.g., "assets/logo.png")
#     -> Converted to full URL: ${BLOB_BASE_URL}/assets/logo.png
#   - Full URLs (e.g., "https://cdn.example.com/logo.png")
#     -> Used as-is
#
# Images are served directly from blob storage (not downloaded).

branding:
  # Main logo (appears in header)
  logo:
    src: "assets/logo.png"
    altText: "Heritage Logo"

  # Footer logo (typically government crest)
  footerLogo:
    src: "assets/footer-logo.svg"
    altText: "Government Logo"

  # Favicon
  favicon: "assets/favicon.ico"

  # Theme variant: "dark" or "light"
  variantClass: "dark"

# ============================================
# MAP DEFAULTS
# ============================================
# Default map center and zoom when page loads

location:
  # [latitude, longitude]
  defaultCenter: [54.6, -5.9]  # Example: Belfast

  # Initial zoom level (1-18)
  defaultZoom: 8

  # Optional: restrict map bounds [[sw_lat, sw_lng], [ne_lat, ne_lng]]
  # bounds:
  #   - [53.0, -8.5]
  #   - [55.5, -5.0]

# ============================================
# HEADER CONFIGURATION
# ============================================
header:
  # Main title in header
  siteTitle: "Heritage Register"

  # Subtitle/tagline
  subline: "Explore our heritage assets"

  # Header palette: "default", "dark", "dark-alt"
  palette: "default"

  # Show Queensland "Delivering for QLD" logo variant
  hasDeliveringForQLDLogo: false

  # Pre-header bar (top navigation strip)
  preHeader:
    palette: "dark"

    # Global link (typically government home)
    globalLink:
      url: "https://www.gov.example"
      text: "gov.example"

    # Optional: Pre-header logo
    # logo: "https://example.com/header-logo.svg"

    # Action buttons/links in pre-header
    actions:
      - id: "contact"
        text: "Contact us"
        url: "/contact"
        icon: "phone"
      # Dropdown example:
      # - id: "services"
      #   text: "Services"
      #   dropdown:
      #     type: "list"
      #     items:
      #       - text: "Service 1"
      #         url: "/services/1"
      #       - text: "Service 2"
      #         url: "/services/2"
      #     viewMore:
      #       text: "All services"
      #       url: "/services"

  # Main header content area
  mainContent:
    palette: "default"
    url: "/"

    # Logo in main header (overrides branding.logo if set)
    logo:
      src: "assets/logo.png"
      altText: "Site Logo"

    # Secondary logo for co-branded sites
    # secondaryLogo:
    #   src: "assets/partner-logo.svg"
    #   altText: "Partner Organization"

  # Site search configuration
  siteSearch:
    enabled: false
    formAction: "https://www.example.gov/search"

# ============================================
# NAVIGATION
# ============================================
navbar:
  # Brand name shown in mobile nav
  brandname: "Heritage Register"

  # Use alternative color scheme
  alternativecolor: false

  # Vertical orientation (sidebar style)
  verticalorientation: false

  # Navigation items
  navigation:
    - text: "Home"
      url: "/"
      hidelabel: true
      iconname: "qld-icon-home"

    - text: "Search Register"
      url: "/map"

    - text: "FAQ"
      url: "/faq"

    # Dropdown example:
    # - text: "About"
    #   url: "/about"
    #   navigationitems:
    #     - text: "Our Mission"
    #       url: "/about/mission"
    #     - text: "Contact"
    #       url: "/about/contact"

# ============================================
# FOOTER CONFIGURATION
# ============================================
footer:
  # Contact section
  contact:
    title: "Contact us"
    content: "<p>Get in touch for enquiries, feedback and complaints.</p>"
    buttonLabel: "Contact us"
    buttonLink: "/contact"
    hasBorderColumn: false
    showList: false

  # Acknowledgement statements
  acknowledgements:
    - title: "Acknowledgement"
      content: "<p>We acknowledge the Traditional Owners of the land and pay respect to Elders past and present.</p>"

  # Organisation link block
  organisationLink:
    show: true
    URL: "https://www.gov.example"
    text: "Example Government"

  # Copyright notice
  copyright:
    content: "© Example Government"
    showYearFrom: true
    yearFrom: 2024

  # Footer links column
  footerLinks:
    title: "Useful links"
    hasBorderColumn: false
    list:
      - label: "Help"
        link: "/help"
      - label: "Privacy"
        link: "/privacy"
      - label: "Disclaimer"
        link: "/disclaimer"
      - label: "Accessibility"
        link: "/accessibility"
      - label: "Copyright"
        link: "/copyright"

  # Social media links
  followLinks:
    - label: "Facebook"
      link: "https://www.facebook.com/example"
      icon: "facebook"
      target: "_blank"
    - label: "Twitter"
      link: "https://twitter.com/example"
      icon: "twitter-x"
      target: "_blank"
    - label: "LinkedIn"
      link: "https://www.linkedin.com/company/example"
      icon: "linkedin"
      target: "_blank"

  # Footer logo (typically same as branding.footerLogo)
  footerLogo:
    src: "assets/footer-logo.svg"
    alt: "Footer logo"
    show: true

  # Feedback form (optional inline form)
  feedbackForm:
    show: false
    # title: "Provide feedback"
    # description: "Help us improve by providing your feedback."
    # action: "/submit-feedback"
    # method: "POST"
    # submitLabel: "Submit feedback"

# ============================================
# ANALYTICS
# ============================================
analytics:
  # Google Tag Manager ID
  ga4token: ""

  # Google Analytics 4 Measurement ID
  ga4gtag: ""

# ============================================
# FEATURE FLAGS
# ============================================
features:
  # Show feedback form/link
  showFeedbackForm: true

  # Enable LiDAR 3D viewer for assets
  showLidarViewer: false

  # Show cookie consent banner
  enableCookieConsent: true

  # Show phase tag (alpha/beta)
  showPhaseTag: true

  # Current phase: "alpha", "beta", "live"
  phase: "beta"

# ============================================
# EXTERNAL LINKS
# ============================================
externalLinks:
  # Full Arches instance URL (for deep links)
  archesInstance: "https://arches.heritage.example.gov"

  # External feedback form (e.g., Google Forms)
  feedbackForm: ""

  # Main department/organization website
  mainDepartment: "https://www.heritage.example.gov"

  # Product name (for phase banner)
  product: "Heritage Public Viewer"

# ============================================
# ADDITIONAL PARAMS
# ============================================
# Any additional params passed to Hugo templates
params:
  # Cookies policy page URL
  cookies: "/cookies/"

  # Feedback page URL
  feedbackurl: "/feedback/"
