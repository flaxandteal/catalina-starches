name: Run full build
run-name: Run full build
on:
  workflow_dispatch: {}
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-starches:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: 'true'

      - name: Install s3cmd
        run: |
          sudo apt-get update
          sudo apt-get install -y s3cmd

      - name: Configure s3
        run: |
          cat > ~/.s3cfg << EOF
          [default]
          access_key = ${S3_ACCESS_KEY}
          secret_key = ${S3_SECRET_KEY}
          host_base = ${S3_HOST_BASE}
          host_bucket = ${S3_HOST_BASE}/%(bucket)s
          use_https = True
          signature_v2 = False
          EOF
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_HOST_BASE: ${{ secrets.S3_HOST_BASE }}

      - name: Fetch graphs
        run: |
          mkdir -p prebuild/graphs/resource_models
          
          # Download all JSON files from graphs directory
          s3cmd get --recursive \
                "s3://catalina-starches/starches/graphs/" \
                prebuild/graphs/resource_models/
          
          echo "✓ Downloaded graph files:"
          ls -lh prebuild/graphs/resource_models/

      - name: Fetch business data
        run: |
          mkdir -p prebuild/business_data
          
          # Download all JSON files from business data directory
          s3cmd get --recursive \
                "s3://catalina-starches/starches/business_data/" \
                prebuild/business_data/
          
          echo "✓ Downloaded business data files:"
          ls -lh prebuild/business_data/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build . \
            --file ./Dockerfile \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:${{ github.sha }} \
            --build-arg STARCHES_INCLUDE_PRIVATE=0
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches:${{ github.sha }}
