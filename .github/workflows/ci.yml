name: CI

# Public-runner CI only. This repo is public, so it deliberately contains NO
# self-hosted runner jobs and NO secrets — a fork PR must never be able to
# reach internal infrastructure.
#
# The full image build/test/deploy lives in the private catalina-fluxcd repo
# (.github/workflows/build-starches.yml) and is what actually ships to the
# cluster via Flux image automation. This job only gives fast, secret-free
# feedback on lint + unit tests.

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    name: Lint & unit tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: CSS lint
        run: npm run test:lint:css

      - name: Unit tests (vitest)
        run: npx vitest run
