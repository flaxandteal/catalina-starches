name: Build and Test

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches:
      - '**'

jobs:
  build_image_job:
    runs-on: ubuntu-latest
    name: Build Docker Image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: false
          lfs: false

      - name: Download and extract prebuild tarball
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/${{ secrets.PREBUILD_TARBALL }} prebuild.tar.gz --endpoint-url ${{ secrets.S3_ENDPOINT_URL }}
          tar -xzf prebuild.tar.gz -C .
          rm prebuild.tar.gz
          echo "Extracted files:"
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build . \
            --file ./Dockerfile \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:latest-${{ github.run_id }} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:${{ github.sha }} \
            --build-arg STARCHES_INCLUDE_PRIVATE=1
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:latest-${{ github.run_id }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:${{ github.sha }}

  test_job:
    needs: build_image_job
    runs-on: ubuntu-latest
    name: Test Job
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker Image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:${{ github.sha }}

      - name: Extract docs Directory
        run: |
          mkdir -p docs
          docker create --name temp-container ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/catalina-starches-private:${{ github.sha }}
          docker cp temp-container:/usr/share/nginx/html/. ./docs/
          docker rm temp-container
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run CSS linter
        run: npm run test:lint:css
      
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          start: npx serve docs -l 1314
          wait-on: 'http://127.0.0.1:1314'
          wait-on-timeout: 60
          browser: electron
          config: baseUrl=http://127.0.0.1:1314,video=false
          install: false
      
      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
